<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Votar</title>
</head>
<body>
  <script>
    let edad = Number(prompt("Ingresa tu edad:"));

    if (edad >= 18) {
      alert("Eres mayor de edad, puedes votar.");
    } else {
      alert("No eres mayor de edad, no puedes votar.");
    }
  </script>
</body>
</html>
